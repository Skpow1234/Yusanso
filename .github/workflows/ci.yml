name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests services
      - name: Typecheck
        run: uv run mypy src || true
      - name: Unit tests
        run: uv run pytest tests/unit -q --no-cov || uv run pytest tests/unit -q
